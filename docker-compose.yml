version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"               # Backend exposed on localhost:8080
    environment:
      NODE_OPTIONS: "--openssl-legacy-provider"
      # Add any other env vars or use env_file here
    volumes:
      - ./server:/app
      # - /app/node_modules
    depends_on:
      - mongo
      - redis
    command: nodemon server.js

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8000:8000"              # React dev server exposed on localhost:3000
    environment:
      NODE_OPTIONS: "--openssl-legacy-provider" 
      CHOKIDAR_USEPOLLING: true  # Enables hot reload on Docker for Mac/Windows
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm start

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=yourpassword
      - SESSION_SECRET=yourSecret
      - COOKIE_NAME=session_id
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:


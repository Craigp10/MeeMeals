services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/meemeals
      - SESSION_SECRET=${SESSION_SECRET:-your-secret-key-change-in-production}
      - COOKIE_NAME=meemeals_session
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis - uncomment when needed for caching/sessions
  # redis:
  #   image: redis:7
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s
  #
  # To re-enable Redis:
  # 1. Uncomment the redis service above
  # 2. Add to app.depends_on: redis: condition: service_healthy
  # 3. Add to app.environment: REDIS_HOST=redis, REDIS_PORT=6379
  # 4. Uncomment redis_data in volumes below

volumes:
  mongo_data:
  # redis_data:
